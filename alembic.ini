[alembic]
script_location = db/migrations
prepend_sys_path = ..
# the connection string is taken from app.db.settings (DATABASE_MIGRATE_URL), never from this file

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s %(message)s
